name: Build TapeSat (Windows)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build --config Release

      - name: List results
        run: Get-ChildItem -Path build -Recurse -Filter *.vst3 | Select-Object FullName

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: TapeSat-Windows
          if-no-files-found: error
          path: |
            build/*_artefacts/Release/VST3/*.vst3
            build/*_artefacts/Release/Standalone/*.exe
